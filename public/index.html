<style>
/* Layout: a monitoring room — sticky top bar with role tabs; dashboard reads summary → Excellence → districts → matrix → list */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EAF0EC; --line:#D5DFD9; --fg:#17231D; --muted:#5B6B62; --accent:#0E6B4E; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6;

  --ex-pp:#D6336C; --ex-se:#12968A; --ex-pe:#7048C2; --ex-ge:#2E6FB7; --ex-he:#E07B1F;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.05);
  --f-display:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif; --f-body:"Sarabun","Leelawadee UI","Tahoma",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#16201B; --surface-2:#1D2A24; --line:#2C3B34; --fg:#E6EEE9; --muted:#9AABA2; --accent:#4CC79A; --accent-ink:#06241A; --accent-soft:#1B3A2E;
  --pass:#6BD49A; --pass-bg:#1E4D33; --watch:#9BE0B4; --watch-bg:#21402F; --near:#F2C94C; --near-bg:#4A3B10; --fail:#FF8A80; --fail-bg:#5A2020; --pend:#A3ADA8; --pend-bg:#2A3530;
  --ex-pp:#F06595; --ex-se:#38C9B9; --ex-pe:#A48AF0; --ex-ge:#6AA7EC; --ex-he:#F4A259; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#16201B; --surface-2:#1D2A24; --line:#2C3B34; --fg:#E6EEE9; --muted:#9AABA2; --accent:#4CC79A; --accent-ink:#06241A; --accent-soft:#1B3A2E;
  --pass:#6BD49A; --pass-bg:#1E4D33; --watch:#9BE0B4; --watch-bg:#21402F; --near:#F2C94C; --near-bg:#4A3B10; --fail:#FF8A80; --fail-bg:#5A2020; --pend:#A3ADA8; --pend-bg:#2A3530;
  --ex-pp:#F06595; --ex-se:#38C9B9; --ex-pe:#A48AF0; --ex-ge:#6AA7EC; --ex-he:#F4A259; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
.demo-role{display:flex;align-items:center;gap:6px;font-size:13px}
.who{flex-wrap:wrap;max-width:100%;min-width:0}.demo-role select{max-width:170px}
@media (max-width:640px){.who{width:100%}.who .pn{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.demo-bar{background:var(--near-bg);color:var(--fg);font-size:13.5px;padding:6px 16px;text-align:center}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}

button,input,select,textarea{font:inherit;color:inherit}

.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}

main.wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px}
.dist{display:flex;flex-direction:column;gap:6px}
.drow{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;border:0;background:transparent;padding:4px 6px;border-radius:8px;cursor:pointer;text-align:left}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:0;font-size:13px}
.mx th{font-weight:600;color:var(--muted);text-align:center;padding:6px 4px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}

.cell{display:block;border-radius:5px;padding:3px 1px;font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer;border:1.5px solid transparent;width:100%}
.s-pass{background:var(--pass-bg);color:var(--pass)} .s-watch{background:var(--watch-bg);color:var(--watch);border-color:var(--pass)!important}
.s-near{background:var(--near-bg);color:var(--near)} .s-fail{background:var(--fail-bg);color:var(--fail)} .s-pending{background:var(--pend-bg);color:var(--pend)} .s-na{background:transparent;color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;border:1.5px solid transparent;font-size:12.5px;font-weight:600;white-space:nowrap}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.list .plan td{font-size:13px;color:var(--muted);padding-top:12px;border-bottom:0}
.row-btn{border:0;background:transparent;text-align:left;cursor:pointer;padding:0;color:inherit}
.row-btn:hover .t{text-decoration:underline}
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;margin-right:6px}
.sub td:first-child{padding-left:30px}
.meta{font-size:12.5px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,15,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--surface);z-index:41;overflow-y:auto;border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.drawer h2{font-size:19px}
.dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:14.5px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .f.full{grid-column:1/-1}
.form .f>span{font-size:13px;color:var(--muted);font-weight:600}
.form .help{font-size:12.5px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;min-width:0}
legend{font-size:13px;color:var(--muted);font-weight:600;padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:2px 4px 2px 2px;font-size:13.5px}

.hits{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;margin-top:4px;overflow:hidden}

.hits img{width:22px;height:22px;border-radius:50%}
.entry{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}

.mine button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.mine button[aria-current="true"]{background:var(--accent-soft)}
.mine button:hover{background:var(--surface-2)}
.mine .t{font-size:14px}
.etable th,.etable td{border-bottom:1px solid var(--line);padding:6px;font-size:14px;text-align:left;vertical-align:middle}
.etable th{font-size:12.5px;color:var(--muted);font-weight:600}
.etable input[type=number]{width:100%;min-width:76px;text-align:right}
.etable input[type=text]{width:100%;min-width:120px}
.save-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:60;font-size:14px}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}

.note{font-size:13.5px;color:var(--muted)}
.gap{font-size:12.5px;line-height:1.45;margin-top:4px;font-variant-numeric:tabular-nums}
.gap.bad{color:var(--fail)} .gap.ok{color:var(--muted)} .gap b{font-weight:600}
.exp{position:relative}

.tchip.src{border-color:var(--accent);color:var(--accent)}
.tchip{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);line-height:1.6;white-space:nowrap}

@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.exgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}

<div class="demo-bar" id="demoBar" hidden>โหมดทดลอง: ข้อมูลที่บันทึกเก็บอยู่ในเบราว์เซอร์นี้เท่านั้น ใช้ช่อง “บทบาท” มุมขวาบนเพื่อสลับดูแต่ละส่วน</div>
<script>if(window.PLK_CONFIG&&PLK_CONFIG.mode!=="server")document.getElementById("demoBar").hidden=false</script>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent)"/><path d="M8 22.5h4l2.5-7 4 11 3-8.5 1.5 4.5H26" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>PLK KPI <span id="yearLbl" class="num">2570</span></b><small>ตัวชี้วัดกระทรวงสาธารณสุข · สสจ.พิษณุโลก</small></div>
  </div>
  <nav class="tabs" aria-label="ส่วนของระบบ">
    <button class="tab" data-view="dashboard" aria-current="page">แดชบอร์ด</button>
    <button class="tab" data-view="entry" hidden>บันทึกผล</button>

</div></header>

<main class="wrap" id="app"><div class="empty">กำลังโหลดข้อมูลตัวชี้วัด…</div></main>
<div id="drawerHost"></div>

<script>
/* ================= CONSTANTS ================= */
const DISTRICTS=[["d01","เมืองพิษณุโลก"],["d02","นครไทย"],["d03","ชาติตระการ"],["d04","บางระกำ"],["d05","บางกระทุ่ม"],["d06","พรหมพิราม"],["d07","วัดโบสถ์"],["d08","วังทอง"],["d09","เนินมะปราง"]].map(([id,name])=>({id,name}));
const DIST_IDS=DISTRICTS.map(d=>d.id);
const AREAS=[{id:"P",name:"ภาพรวมจังหวัด"},...DISTRICTS];
const EXC=[
  {id:"PP",name:"PP&P Excellence",c:"var(--ex-pp)"},
  {id:"SE",name:"Service Excellence",c:"var(--ex-se)"},
  {id:"PE",name:"People Excellence",c:"var(--ex-pe)"},
  {id:"GE",name:"Governance Excellence",c:"var(--ex-ge)"},
  {id:"HE",name:"Health-Related Economy Excellence",c:"var(--ex-he)"}];
const FORMULAS={
  percent:{t:"ร้อยละ",f:()=>"A ÷ B × 100"},
  rate:{t:"อัตรา (ต่อประชากร/ต่อการเกิด)",f:k=>`A ÷ B × ${fmtInt(k.mult||100000)}`},
  ratio:{t:"สัดส่วน",f:()=>"A ÷ B"},
  count:{t:"จำนวน",f:()=>"A"},
  change_prev:{t:"เพิ่มขึ้น/ลดลงจากปีก่อน",f:()=>"(A − ปีก่อน) ÷ ปีก่อน × 100"},
  change_avg:{t:"เพิ่มขึ้น/ลดลงจากค่าเฉลี่ยย้อนหลัง",f:k=>`(A − ค่าเฉลี่ย ${k.years||3} ปี) ÷ ค่าเฉลี่ย × 100`},
  manual:{t:"กรอกค่าผลลัพธ์โดยตรง",f:()=>"ผู้รับผิดชอบกรอกค่าที่คำนวณแล้ว"},
  qualitative:{t:"ประเมินผ่าน/ไม่ผ่าน",f:()=>"ผู้รับผิดชอบระบุผลผ่าน/ไม่ผ่าน"}};
const COND={">=":"≥",">":">","<=":"≤","<":"<"};

  const asOf=[r1.asOf,r2.asOf].filter(Boolean).sort()[0]||null;const note=[r1.note,r2.note].filter(Boolean).join(" / ");

  const o={a:(num(r1.a)||0)+(num(r2.a)||0),b:(num(r1.b)||0)+(num(r2.b)||0),p:[],asOf,note,src:r1.src===r2.src?r1.src:"mix"};
  const n=Math.max((r1.p||[]).length,(r2.p||[]).length);for(let i=0;i<n;i++)o.p[i]=(num((r1.p||[])[i])||0)+(num((r2.p||[])[i])||0);

function leafInputs(k,area){
  if(area==="P"&&k.level==="district"&&(k.agg||"pooled")==="pooled"){
    const ds=inclDistricts(k);let a=0,b=0,p=[],n=0,fails=0,vals=[],forcedN=0,numN=0,asofs=[],srcs=new Set();
    for(const d of ds){const r=getRes(k.id,d);if(!hasData(k,r))continue;n++;if(r.asOf)asofs.push(r.asOf);if(r.src)srcs.add(r.src);if(r.forcePass)forcedN++;if(!hasNum(k,r))continue;numN++;a+=num(r.a)||0;b+=num(r.b)||0;(r.p||[]).forEach((x,i)=>{p[i]=(p[i]||0)+(num(x)||0)});if(r.pass===false)fails++;if(num(r.value)!=null)vals.push(num(r.value))}

function gapThreshold(k,inp,t){const B=num(inp.b),p=inp.p||[];switch(k.formula){

  case "count":return t;case "change_prev":{const P=num(p[0]);return P?P*(1+t/100):null}

/* ================= DEMO DATA (in memory only) ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demoTarget(k){const lo=(k.cond||">=").startsWith("<");switch(k.formula){
  case "percent":return lo?10:80;case "rate":return (num(k.mult)||100000)>=100000?(lo?15:50):(lo?4:10);case "ratio":return lo?1:1;
  case "count":return 10;case "change_prev":case "change_avg":return lo?-3:5;default:return lo?10:80}}
function buildDemo(){const rnd=mulberry32(2570);const res={},tgt={};
  for(const k of S.kpis){if(!hasOwn(k))continue;const t=num(k.target)??demoTarget(k);tgt[k.id]=t;const lo=(k.cond||">=").startsWith("<");
    const areas=k.level==="district"?inclDistricts(k):["P"];
    for(const per of S.settings.periods)for(const a of areas){let v,r={};const j=rnd();
      if(k.formula==="change_prev"||k.formula==="change_avg"){v=t+(j-0.35)*10;const base=80+rnd()*120;const n=k.formula==="change_avg"?(k.years||3):1;r.p=Array.from({length:n},()=>Math.round(base*(0.9+rnd()*0.2)));const m=r.p.reduce((s,x)=>s+x,0)/n;r.a=Math.max(0,Math.round(m*(1+v/100)))}
      else if(k.formula==="count"){r.a=Math.round(t*(0.7+j*0.8))}
      else if(k.formula==="qualitative"){r.pass=j>0.3}
      else if(k.formula==="manual"){r.value=+(lo?t*(0.5+j*0.9):t*(0.82+j*0.3)).toFixed(2)}
      else if(k.formula==="rate"){const mult=num(k.mult)||100000;r.b=Math.round((mult>=100000?60000:4000)*(0.6+rnd()*0.8));v=lo?t*(0.3+j*0.95):t*(0.85+j*0.4);r.a=Math.round(v*r.b/mult)}
      else{r.b=Math.round(80+rnd()*500);v=lo?t*(0.35+j*0.85):Math.min(100,t+(j-0.3)*24);if(k.formula==="ratio")v=lo?t*(0.6+j*0.7):t*(0.7+j*0.6);r.a=Math.max(0,Math.min(k.formula==="percent"?r.b:Infinity,Math.round(r.b*v/(k.formula==="percent"?100:1))))}
      const asOf=per.end&&per.end<"2026-10-28"?per.end:"2026-10-25";r.asOf=asOf;res[resKey(k.id,a,per.id,"moph")]=r;
      if(k.affSplit&&k.formula!=="qualitative"&&k.formula!=="manual"){const o={asOf:"2026-10-20"};const f=0.15+rnd()*0.15;if(r.b!=null)o.b=Math.max(1,Math.round(r.b*f));if(r.a!=null)o.a=Math.max(0,Math.round(r.a*f*(0.85+rnd()*0.3)));if(r.p)o.p=r.p.map(x=>Math.round(x*f));if(o.b!=null&&o.a>o.b&&k.formula==="percent")o.a=o.b;res[resKey(k.id,a,per.id,"other")]=o}}}
  return {res,tgt}}

async function paintPeople(root){if(!S.user)return;const els=[...(root||document).querySelectorAll("[data-uid]")];if(!els.length)return;
  const ids=[...new Set(els.map(e=>e.dataset.uid))];let ps={};try{ps=await S.user.profiles(ids)}catch(e){}
  for(const e of els){const p=ps[e.dataset.uid];if(!p)continue;const n=e.querySelector(".pn");if(n)n.textContent=p.name||"ผู้ใช้ที่ไม่ระบุชื่อ";const im=e.querySelector("img");if(im)im.src=p.avatarUrl}}
function personChip(id,removable){return `<span class="person" data-uid="${esc(id)}"><img alt=""><span class="pn">…</span>${removable?`<button type="button" data-rm="${esc(id)}" aria-label="นำออก">×</button>`:""}</span>`}

function indexKpis(list){S.kpis=list.slice().sort((a,b)=>(num(a.order)??999)-(num(b.order)??999)||String(a.code).localeCompare(String(b.code)));

  h+=`<section><h2 style="font-size:18px;margin-bottom:10px">ผลการดำเนินงานราย Excellence</h2><div class="exgrid">${EXC.map(e=>{const it=items.filter(k=>k.exc===e.id);const t=tally(it,area);

      <div class="counts"><span>ทั้งหมด <b class="num">${t.total}</b></span><span>ผ่าน <b class="num">${t.passAll}</b></span><span>ไม่ผ่าน <b class="num">${t.near+t.fail}</b></span><span>รอ <b class="num">${t.pending}</b></span></div></button>`}).join("")}</div></section>`;
  // districts
  const drows=DISTRICTS.map(d=>{const t=tally(countedItems(d.id),d.id);return {d,t}});
  h+=`<section class="two"><div class="panel"><h2>ร้อยละความสำเร็จรายอำเภอ<small>เฉพาะตัวชี้วัดที่วัดในอำเภอนั้น</small></h2><div class="dist">
    ${drows.map(({d,t})=>{const w=x=>t.total?(x/t.total*100):0;return `<button class="drow" data-area="${d.id}" aria-pressed="${S.area===d.id}"><span class="nm">${esc(d.name)}</span>

    <div class="legend" style="margin-top:10px">${["pass","watch","near","fail","pending"].map(s=>chip(s)).join("")}</div></div>`;

function periodName(){return (S.settings.periods.find(p=>p.id===S.period)||{}).name||""}
function listTable(area){const q=S.q.trim().toLowerCase();let rows="";
  for(const e of EXC){if(S.exF!=="all"&&S.exF!==e.id)continue;const tops=topItems().filter(k=>k.exc===e.id&&matchType(k));let body="",lastPlan=null;
    for(const k of tops){const ev=evalItem(k,area);if(ev.status==="na")continue;
      const st=S.stF;const match=s=>st==="all"||(st==="pass"&&isPass(s))||(st==="near"&&s==="near")||(st==="fail"&&s==="fail")||(st==="pending"&&isPend(s));
      const kids=kidsOf(k).filter(c=>applicable(c,area));const kidEv=kids.map(c=>[c,evalItem(c,area)]);
      const textHit=x=>!q||x.name.toLowerCase().includes(q)||String(x.code).toLowerCase().includes(q);
      if(!(match(ev.status)||kidEv.some(([,v])=>match(v.status))))continue;if(!(textHit(k)||kids.some(textHit)))continue;
      if(k.plan&&k.plan!==lastPlan){body+=`<tr class="plan"><td colspan="5">แผนงาน ${esc(k.plan)}${k.project?` · โครงการ ${esc(k.project)}`:""}</td></tr>`;lastPlan=k.plan}
      body+=rowHtml(k,ev,area,kids.length);
      if(kids.length&&(S.open.has(k.id)||q||st!=="all"))for(const [c,v] of kidEv)body+=rowHtml(c,v,area,0,true)}
    if(body)rows+=`<tr class="grp" style="--c:${e.c}"><td colspan="5"><span class="exdot"></span>${esc(e.name)}</td></tr>`+body}
  if(!rows)return `<div class="empty">ไม่พบตัวชี้วัดตามตัวกรอง</div>`;
  return `<table class="list"><thead><tr><th>ตัวชี้วัด</th><th>เกณฑ์</th><th>ผลงาน</th><th>สถานะ</th><th>ข้อมูล ณ</th></tr></thead><tbody>${rows}</tbody></table>`}
function rowHtml(k,ev,area,nKids,isSub){
  const val=ev.value!=null?fmtValue(k,ev.value):(ev.derived?ev.summary:"—");
  const rep=ev.inp&&ev.inp.pooled&&ev.inp.reported<ev.inp.expected?`<div class="meta">รายงาน ${ev.inp.reported}/${ev.inp.expected} อำเภอ</div>`:"";
  const tog=nKids?` <button class="btn small" data-tog="${esc(k.id)}" aria-expanded="${S.open.has(k.id)}">${S.open.has(k.id)?"ซ่อน":"แสดง"}ตัวย่อย ${nKids}</button>`:"";
  return `<tr class="${isSub?"sub":""}"><td><button class="row-btn" data-open="${esc(k.id)}"><span class="code">${esc(k.code)}</span><span class="t">${esc(k.name)}</span></button>${tog}
    <div class="meta">${k.level==="district"?"ระดับอำเภอ":"ระดับจังหวัด"}${k.dept?" · "+esc(k.dept):""}${typeLabels(k).map(t=>` <span class="tchip">${esc(t)}</span>`).join("")}</div></td>
    <td>${critText(k)}</td><td class="num">${esc(val)}${rep}${gapHtml(k,ev)}</td><td>${chip(ev.status)}</td><td class="meta" style="white-space:nowrap">${(()=>{const x=asOfOf(k,area);return x&&x.asOf?esc(fmtDay(x.asOf,true))+" "+srcBadge(x.src):"—"})()}</td></tr>`}

const todayISO=()=>new Date().toLocaleDateString("sv-SE");
function withCtx(aff,fn){const sa=S.aff,sd=S.demoOn;S.aff=aff;S.demoOn=false;try{return fn()}finally{S.aff=sa;S.demoOn=sd}}
function entryAreas(k){if(k.level==="district"){const a=inclDistricts(k).slice();if((k.agg||"pooled")==="manual")a.unshift("P");return a}return ["P"]}
function entryAffs(k){return k.affSplit?["moph","other"]:["moph"]}
function isMine(k){const m=S.member;const par=k.parent&&S.byId[k.parent];const approved=m&&m.status==="approved";
  return (approved&&((m.depts||[]).includes(k.dept)||(par&&(m.depts||[]).includes(par.dept))))||(k.owners||[]).includes(S.myId)||!!(par&&(par.owners||[]).includes(S.myId))}
function canEnter(k){if(S.isAdmin)return true;if(!S.member||S.member.status!=="approved")return false;return isMine(k)}
function myItems(){if(!S.myId)return [];return S.kpis.filter(k=>hasOwn(k)&&canEnter(k)&&(S.isAdmin?isMine(k):true))}
function entryList(){return S.isAdmin&&!S.entryMineOnly?S.kpis.filter(hasOwn):myItems()}
function renderEntry(){const app=$("#app");if(S.entryDirty&&$("#entryForm")){refreshEntryList();return}
  if(!S.myId){app.innerHTML=`<div class="panel empty">กด “เข้าสู่ระบบ” มุมขวาบนเพื่อบันทึกผล</div>`;return}

  const list=entryList();if(S.entrySel&&!list.find(k=>k.id===S.entrySel))S.entrySel=null;if(!S.entrySel&&list.length)S.entrySel=list[0].id;

    ${S.isAdmin?`<label class="toggle"><input type="checkbox" id="mineOnly" ${S.entryMineOnly?"checked":""}> เฉพาะที่ฉันรับผิดชอบ</label>`:""}</div>
    ${approved&&!S.isAdmin?`<p class="note" style="margin:0">สิทธิ์บันทึกผลของคุณ: ${(S.member.depts||[]).map(esc).join(", ")||"เฉพาะตัวชี้วัดที่ได้รับมอบหมาย"}</p>`:""}`;
  if(!list.length){h+=`<div class="panel empty">${S.isAdmin?"ยังไม่มีตัวชี้วัดที่คุณรับผิดชอบ ยกเลิกช่อง “เฉพาะที่ฉันรับผิดชอบ” เพื่อบันทึกแทนผู้รับผิดชอบ":"ยังไม่มีตัวชี้วัดของกลุ่มงานที่คุณได้รับสิทธิ์ ติดต่อผู้ดูแลระบบ"}</div>`;app.innerHTML=h;bindEntryTop();return}
  h+=`<div class="entry"><div class="panel" style="padding:10px"><div class="mine" id="mineList"></div></div><div class="panel" id="entryPane"></div></div>`;
  app.innerHTML=h;bindEntryTop();refreshEntryList();renderEntryForm()}
function renderRegister(app){const q=S.myReq,m=S.member;const depts=S.settings.depts||DEPTS;const sel=new Set((q&&q.depts)||[]);

  <label class="f"><span>ตำแหน่ง</span><input type="text" id="rPos" value="${esc(q&&q.position||"")}" placeholder="เช่น นักวิชาการสาธารณสุขชำนาญการ"></label>

  $("#regForm").onsubmit=async e=>{e.preventDefault();const ds=[...document.querySelectorAll(".rDept")].filter(c=>c.checked).map(c=>c.value);if(!ds.length){$("#rMsg").textContent="เลือกกลุ่มงานอย่างน้อย 1 กลุ่ม";return}

function bindEntryTop(){const p=$("#ePer");if(p)p.onchange=e=>{if(S.entryDirty&&!confirmLeave())return(e.target.value=S.period);changePeriod(e.target.value)};

function inputCells(k,area,r,dis){r=r||{};const d=dis?" disabled":"";const n=(nm,val,lbl)=>`<td><input type="number" step="any" inputmode="decimal" id="in-${area}-${nm}" data-area="${area}" data-f="${nm}" value="${esc(val??"")}" aria-label="${esc(areaName(area))} ${esc(lbl)}"${d}></td>`;
  const p=r.p||[];switch(k.formula){
  case "percent":case "rate":case "ratio":return n("a",r.a,"A")+n("b",r.b,"B");
  case "count":return n("a",r.a,"A");
  case "change_prev":return n("a",r.a,"ปีนี้")+n("p0",p[0],"ปีก่อน");
  case "change_avg":return n("a",r.a,"ปีนี้")+Array.from({length:k.years||3},(_,i)=>n("p"+i,p[i],`ย้อนหลังปีที่ ${i+1}`)).join("");

function inputHeads(k){const y=S.settings.year||2570;switch(k.formula){
  case "percent":case "rate":case "ratio":return `<th>A ${esc(k.aLabel||"ผลงาน")}</th><th>B ${esc(k.bLabel||"เป้าหมาย/ประชากร")}</th>`;
  case "count":return `<th>A ${esc(k.aLabel||"จำนวน")}</th>`;

function numFields(k){switch(k.formula){case "percent":case "rate":case "ratio":return ["a","b"];case "count":return ["a"];case "change_prev":return ["a","p0"];case "change_avg":return ["a",...Array.from({length:k.years||3},(_,i)=>"p"+i)];case "manual":return ["value"];default:return ["pass"]}}
function readRow(k,area){const el=f=>document.getElementById(`in-${area}-${f}`);const g=f=>{const e=el(f);return e?e.value:""};

  r.a=num(g("a"));if(["percent","rate","ratio"].includes(k.formula))r.b=num(g("b"));
  if(k.formula==="change_prev")r.p=[num(g("p0"))];if(k.formula==="change_avg")r.p=Array.from({length:k.years||3},(_,i)=>num(g("p"+i)));return r}
function fillRow(k,area,r,dis){r=r||{};const p=r.p||[];for(const f of numFields(k)){const e=document.getElementById(`in-${area}-${f}`);if(!e)continue;

    </tbody></table></div>
    <p class="note" style="margin:8px 0 0">วันเวลาที่บันทึกและผู้บันทึกระบบเก็บให้อัตโนมัติ · ช่อง “ข้อมูล ณ วันที่” คือวันที่ของข้อมูลผลงาน เช่น วันที่ดึงรายงาน · ติ๊ก “ถือว่าผ่าน” ได้เมื่อผลคำนวณไม่สะท้อนความจริง เช่น ไม่มีการตาย ต้องระบุเหตุผลในหมายเหตุ และควรกรอก A, B ที่มี (เช่น A = 0)</p>
    <div class="save-row" style="margin-top:12px"><span class="note" id="saveNote">${canSave?"":"บัญชีนี้ไม่มีสิทธิ์บันทึกตัวชี้วัดนี้"}</span><button type="button" class="btn" id="cancelEdit">ยกเลิกการแก้ไข</button><button type="submit" class="btn primary" ${canSave?"":"disabled"}>บันทึก</button></div></form>`;
  const form=$("#entryForm");
  const recalc=()=>{const tmp=Object.assign({},S.results);for(const a of areas)tmp[resKey(k.id,a,S.period,aff)]=readRow(k,a);const orig=S.results;S.results=tmp;
    withCtx(aff,()=>{const outAreas=[...areas];if(k.level==="district"&&(k.agg||"pooled")==="pooled")outAreas.push("P");
      for(const a of outAreas){const ev=evalLeaf(k,a);const o=pane.querySelector(`[data-out="${a}"]`);if(o)o.textContent=ev.value!=null?fmtValue(k,ev.value):"—";const s=pane.querySelector(`[data-st="${a}"]`);if(s)s.innerHTML=chip(ev.status)+gapHtml(k,ev)}});S.results=orig};
  const setSrc=(a,src)=>{const sel=document.getElementById(`in-${a}-src`);if(sel)sel.value=src;const isH=src==="hdc";const h=hd(a),r=rec(a);
    fillRow(k,a,isH?h:(r&&r.src!=="hdc"?r:{}),isH);const d=document.getElementById(`in-${a}-asof`);if(d){d.value=isH?(h&&h.asOf||""):(r&&r.src!=="hdc"&&r.asOf||"");d.disabled=isH}};
  pane.querySelectorAll("[id$='-src']").forEach(sel=>sel.addEventListener("change",()=>setSrc(sel.dataset.area,sel.value)));
  if(hdcOn){$("#allHdc").onclick=()=>{areas.forEach(a=>setSrc(a,"hdc"));S.entryDirty=true;recalc()};$("#allMan").onclick=()=>{areas.forEach(a=>setSrc(a,"manual"));S.entryDirty=true;recalc()}}
  pane.querySelectorAll("[data-eaff]").forEach(b=>b.onclick=()=>{if(S.entryDirty)return confirmLeave();S.entryAff=b.dataset.eaff;renderEntryForm()});
  recalc();form.addEventListener("input",()=>{S.entryDirty=true;recalc()});form.addEventListener("change",()=>{S.entryDirty=true;recalc()});
  $("#cancelEdit").onclick=()=>{S.entryDirty=false;renderEntryForm();refreshEntryList()};
  form.onsubmit=async e=>{e.preventDefault();if(!S.db)return;const note=a=>(document.getElementById(`in-${a}-note`)||{}).value||"";
    const miss=areas.filter(a=>{const f=document.getElementById(`in-${a}-force`);return f&&f.checked&&!note(a).trim()});
    const noDate=areas.filter(a=>{const r=readRow(k,a);return r.src!=="hdc"&&hasNum(k,r)&&!r.asOf});
    areas.forEach(a=>{const n=document.getElementById(`in-${a}-note`);if(n)n.style.borderColor=miss.includes(a)?"var(--fail)":""});
    if(miss.length){$("#saveNote").textContent=`ระบุเหตุผลในหมายเหตุของพื้นที่ที่ติ๊ก “ถือว่าผ่าน”: ${miss.map(areaName).join(", ")}`;document.getElementById(`in-${miss[0]}-note`).focus();return}
    if(noDate.length){$("#saveNote").textContent=`ระบุ “ข้อมูล ณ วันที่”: ${noDate.map(areaName).join(", ")}`;return}
    const btn=form.querySelector("[type=submit]");btn.disabled=true;$("#saveNote").textContent="กำลังบันทึก…";let n=0;
    try{for(const a of areas){const r=readRow(k,a);const nt=note(a);const key=resKey(k.id,a,S.period,aff);const old=S.results[key]||{};
      const sig=x=>JSON.stringify([x.src||"manual",x.a??null,x.b??null,x.p||null,x.value??null,x.pass??null,x.note||"",!!x.forcePass,x.asOf||""]);
      if(sig({...r,note:nt})===sig({...old,src:old.src||k.defaultSrc||"manual"}))continue;
      const empty=r.src!=="hdc"&&!hasData(k,r)&&!nt;
      if(empty&&S.results[key]){await S.db.doc("results/"+key).delete();n++;continue}if(empty)continue;
      const body={kpi:k.id,area:a,period:S.period,aff,year:S.settings.year||2570,...r,note:nt,updatedBy:S.myId,updatedAt:new Date().toISOString()};
      if(r.src==="hdc"){delete body.asOf}
      await S.db.doc("results/"+key).set(body);n++}
      S.entryDirty=false;toast(n?`บันทึกแล้ว ${n} พื้นที่`:"ไม่มีข้อมูลที่เปลี่ยนแปลง");renderEntryForm();refreshEntryList()}
    catch(err){btn.disabled=false;$("#saveNote").textContent=err&&err.code==="invalid_argument"?"บันทึกไม่ได้: บัญชีนี้ไม่มีสิทธิ์บันทึกตัวชี้วัดนี้ ติดต่อผู้ดูแลระบบ":"บันทึกไม่สำเร็จ ลองอีกครั้ง";}};
  paintPeople(pane)}
function fmtStamp(iso){if(!iso)return "";const d=new Date(iso);if(isNaN(d))return "";return d.toLocaleString("th-TH",{day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(/[๐-๙]/g,c=>"๐๑๒๓๔๕๖๗๘๙".indexOf(c))+" น."}

      <td class="meta">${hasOwn(k)?esc(FORMULAS[k.formula]?.t||""):"จากตัวย่อย"}<div>${typeLabels(k).map(t=>`<span class="tchip">${esc(t)}</span>`).join(" ")}</div></td><td>${hasOwn(k)?critText(k):"—"}</td><td class="meta">${k.level==="district"?`อำเภอ ${inclDistricts(k).length}`:"จังหวัด"}</td>
      <td class="meta">${hasOwn(k)?(k.affSplit?"แยกสังกัด":"รวม"):"—"}${k.hdc&&k.hdc.on?' <span class="tchip src">HDC</span>':""}</td>
      <td><div class="people">${(k.owners||[]).map(id=>personChip(id)).join("")||'<span class="meta">ตามกลุ่มงาน</span>'}</div></td><td><button class="btn small" data-edit="${esc(k.id)}">แก้ไข</button></td></tr>`}).join("")}

function deptChecks(cls,sel){return (S.settings.depts||DEPTS).map(d=>`<label><input type="checkbox" class="${cls}" value="${esc(d)}" ${sel.includes(d)?"checked":""}> ${esc(d.replace("กลุ่มงาน",""))}</label>`).join("")}
function adminPeople(body){const reqs=Object.values(S.requests).filter(q=>q.status==="pending"&&!(S.members[q.uid]&&S.members[q.uid].status==="approved"));const mem=Object.entries(S.members);
  const kpiCount=depts=>S.kpis.filter(k=>hasOwn(k)&&((depts||[]).includes(k.dept)||(k.parent&&S.byId[k.parent]&&(depts||[]).includes(S.byId[k.parent].dept)))).length;
  body.innerHTML=`<div class="panel"><h2>คำขอรอการอนุมัติ<small>${reqs.length} รายการ</small></h2>
    ${reqs.length?`<div class="scroll"><table class="list"><thead><tr><th>ผู้ขอ</th><th>กลุ่มงานที่ให้สิทธิ์</th><th>ข้อมูลประกอบ</th><th></th></tr></thead><tbody>${reqs.map(q=>`<tr data-req="${esc(q.uid)}"><td>${personChip(q.uid)}<div class="meta">${esc(fmtStamp(q.requestedAt))}</div></td>

      <td style="white-space:nowrap"><button class="btn small primary" data-approve="${esc(q.uid)}">อนุมัติ</button> <button class="btn small danger" data-reject="${esc(q.uid)}">ไม่อนุมัติ</button></td></tr>`).join("")}</tbody></table></div>`:'<p class="meta">ไม่มีคำขอใหม่</p>'}</div>
  <div class="panel" style="margin-top:16px"><h2>ผู้มีสิทธิ์บันทึกผล<small>${mem.filter(([,m])=>m.status==="approved").length} คน</small></h2>
    <div class="scroll"><table class="list"><thead><tr><th>ผู้ใช้</th><th>กลุ่มงานที่บันทึกได้</th><th>สถานะ</th><th></th></tr></thead><tbody>${mem.length?mem.map(([id,m])=>`<tr data-mem="${esc(id)}"><td>${personChip(id)}<div class="meta">อนุมัติ ${esc(fmtStamp(m.approvedAt))}</div></td>
      <td><div class="checks" style="font-size:13px">${deptChecks("mDept",m.depts||[])}</div><div class="meta">บันทึกได้ ${kpiCount(m.depts)} ตัวชี้วัด</div></td><td>${m.status==="approved"?'<span class="chip s-pass">ใช้งาน</span>':'<span class="chip s-fail">ระงับ</span>'}</td>
      <td style="white-space:nowrap"><button class="btn small" data-msave="${esc(id)}">บันทึกกลุ่มงาน</button> ${m.status==="approved"?`<button class="btn small danger" data-mrev="${esc(id)}">ระงับสิทธิ์</button>`:`<button class="btn small" data-mres="${esc(id)}">คืนสิทธิ์</button>`}</td></tr>`).join(""):'<tr><td colspan="4" class="meta">ยังไม่มีผู้ได้รับสิทธิ์</td></tr>'}</tbody></table></div></div>
  <div class="panel" style="margin-top:16px"><h2>เพิ่มผู้มีสิทธิ์โดยตรง</h2><div class="form"><div class="f full"><span>ค้นหาผู้ใช้ในองค์กร</span><input type="search" id="pQ" placeholder="พิมพ์ชื่อหรืออีเมล" autocomplete="off"><div id="pHits"></div><div class="people" id="pSel"></div></div>

  <div class="panel" style="margin-top:16px"><p class="note" style="margin:0">ผู้มีสิทธิ์บันทึกผลจะบันทึกได้เฉพาะตัวชี้วัดของกลุ่มงานที่ได้รับสิทธิ์ และตัวที่ระบุชื่อเป็นผู้รับผิดชอบในหน้าแก้ไขตัวชี้วัด เซิร์ฟเวอร์ตรวจสิทธิ์นี้ทุกครั้งที่บันทึก ผู้ดูแลระบบกำหนดได้ในส่วน “บัญชีผู้ใช้” ด้านล่าง</p></div>

  body.querySelectorAll("[data-mres]").forEach(b=>b.onclick=async()=>{try{await S.db.doc("members/"+b.dataset.mres).update({status:"approved",updatedBy:S.myId,updatedAt:now()});toast("คืนสิทธิ์แล้ว")}catch(e){toast("ไม่สำเร็จ")}});

  paintPeople(body);drawAccounts()}

function adminSettings(body){const st=S.settings;body.innerHTML=`<form class="panel" id="setForm"><div class="form">

function matchDistrict(v){const s=String(v??"").trim();if(!s)return null;const m=s.match(/65(0[1-9])/);if(m&&DIST_CODE["65"+m[1]])return DIST_CODE["65"+m[1]];
  const t=s.replace(/^(อ\.|อำเภอ)\s*/,"");const d=DISTRICTS.find(d=>t.includes(d.name)||(d.name==="เมืองพิษณุโลก"&&/^เมือง/.test(t)));return d?d.id:null}
function adminHdc(body){const leaves=S.kpis.filter(hasOwn).sort((a,b)=>(b.hdc&&b.hdc.on?1:0)-(a.hdc&&a.hdc.on?1:0));

    <p class="note" style="margin-top:0">ดาวน์โหลดรายงานจาก HDC เป็น Excel หรือ CSV แล้วนำเข้าที่นี่ ระบบจะรวมผลรายอำเภอและแยกสังกัดให้ ผู้รับผิดชอบเลือกได้ในหน้าบันทึกผลว่าจะใช้ข้อมูล HDC หรือบันทึกเอง</p>
    <div class="form"><label class="f"><span>ตัวชี้วัด</span><select id="hK">${leaves.map(k=>`<option value="${esc(k.id)}">${esc(k.code)} ${esc(k.name.slice(0,60))}${k.hdc&&k.hdc.on?" · HDC":""}</option>`).join("")}</select></label>
    <label class="f"><span>รอบรายงาน</span>${periodSelect("hPer")}</label>
    <label class="f"><span>ข้อมูล ณ วันที่ (วันที่ดึงรายงาน HDC)</span><input type="date" id="hAsOf" value="${todayISO()}"></label>
    <label class="f"><span>สังกัดของข้อมูลในไฟล์</span><select id="hAff"><option value="byhosp">แยกตามรหัสหน่วยบริการ (ใช้รายการนอกสังกัดในหน้าตั้งค่า)</option><option value="moph">ทั้งไฟล์เป็นในสังกัด สป.สธ.</option><option value="other">ทั้งไฟล์เป็นนอกสังกัด สป.สธ.</option></select></label>
    <label class="f full"><span>ไฟล์รายงาน HDC (.xlsx, .xls, .csv)</span><input type="file" id="hFile" accept=".xlsx,.xls,.csv"></label></div>
    <div id="hMap" style="margin-top:12px"></div></div>
  <div class="panel" style="margin-top:16px"><h2>ข้อมูล HDC ในระบบ<small>${esc(periodName())}</small></h2>
    ${Object.keys(counts).length?`<table class="list"><thead><tr><th>ตัวชี้วัด</th><th>จำนวนรายการ</th><th>นำเข้าล่าสุด</th><th></th></tr></thead><tbody>${Object.entries(counts).map(([kid,c])=>{const k=S.byId[kid];return `<tr><td>${k?esc(k.code+" "+k.name):esc(kid)}</td><td class="num">${c.n}</td><td class="meta">${esc(fmtStamp(c.at))}</td><td><button class="btn small danger" data-hdel="${esc(kid)}">ลบข้อมูล HDC รอบนี้</button></td></tr>`}).join("")}</tbody></table>`:'<p class="meta">ยังไม่มีข้อมูล HDC ในรอบนี้</p>'}</div>

function hdcMapper(rows,fileName){const box=$("#hMap");const k=()=>S.byId[$("#hK").value];
  let hr=rows.findIndex(r=>r.filter(x=>String(x).trim()!=="").length>=3);if(hr<0)hr=0;
  const draw=()=>{const K=k();const head=rows[hr]||[];const cols=head.map((h,i)=>`<option value="${i}">${esc(String.fromCharCode(65+(i%26)))}${i>=26?i:""}: ${esc(String(h).slice(0,30))}</option>`).join("");
    const fields=numFields(K).filter(f=>f!=="pass");const flabel={a:"A "+(K.aLabel||"ผลงาน"),b:"B "+(K.bLabel||"เป้าหมาย"),value:"ค่าผลลัพธ์",p0:"ปีก่อน / ย้อนหลังปีที่ 1"};
    const guess=re=>{const i=head.findIndex(h=>re.test(String(h)));return i};
    box.innerHTML=`<div class="form"><label class="f"><span>แถวหัวตาราง</span><input type="number" id="hHr" min="1" value="${hr+1}"></label>
      <label class="f"><span>คอลัมน์อำเภอ (รหัสหรือชื่อ)</span><select id="hDist">${cols}</select></label>
      <label class="f"><span>คอลัมน์รหัสหน่วยบริการ (ถ้ามี)</span><select id="hHosp"><option value="">— ไม่มี —</option>${cols}</select></label>
      ${fields.map(f=>`<label class="f"><span>${esc(flabel[f]||("ย้อนหลังปีที่ "+(+f.slice(1)+1)))}</span><select id="hF-${f}">${cols}</select></label>`).join("")}</div>
      <div id="hPrev" style="margin-top:10px"></div><div class="save-row" style="margin-top:10px"><span class="note" id="hMsg"></span><button class="btn primary" id="hGo">นำเข้า</button></div>`;
    const setG=(id,re)=>{const i=guess(re);if(i>=0)$(id).value=String(i)};setG("#hDist",/อำเภอ|amp|distcode|areacode/i);setG("#hHosp",/hospcode|รหัสหน่วย|รหัส\s*รพ/i);
    if($("#hF-a"))setG("#hF-a",/^(a|result|ผลงาน)$/i);if($("#hF-b"))setG("#hF-b",/^(b|target|เป้าหมาย)$/i);
    box.querySelectorAll("select,input").forEach(x=>x.addEventListener("change",()=>{if(x.id==="hHr"){hr=Math.max(0,(num(x.value)||1)-1);draw();return}preview()}));preview()};
  const agg=()=>{const K=k();const fields=numFields(K).filter(f=>f!=="pass");const dc=+$("#hDist").value,hc=$("#hHosp").value===""?null:+$("#hHosp").value;const affMode=$("#hAff").value;
    const other=new Set((S.settings.otherHosp||[]).map(h=>String(h.code)));const out={};let skipped=0,used=0;
    for(const r of rows.slice(hr+1)){const d=K.level==="district"?matchDistrict(r[dc]):(String(r[dc]).trim()?"P":null);if(!d){if(r.some(x=>String(x).trim()!==""))skipped++;continue}
      const aff=affMode==="byhosp"?(hc!=null&&other.has(String(r[hc]).trim())?"other":"moph"):affMode;const key=d+"|"+aff;const o=out[key]=out[key]||{area:d,aff};let any=false;
      for(const f of fields){const v=num(String(r[+$("#hF-"+f).value]).replace(/,/g,""));if(v==null)continue;any=true;o[f]=(o[f]||0)+v}if(any)used++}
    if(K.level==="district"&&(K.agg||"pooled")==="manual"){for(const aff of ["moph","other"]){const xs=Object.values(out).filter(o=>o.aff===aff&&o.area!=="P");if(!xs.length)continue;const t={area:"P",aff};for(const f of fields)t[f]=xs.reduce((s,o)=>s+(o[f]||0),0);out["P|"+aff]=t}}

    if(S.view==="admin"&&$("#drawerHost").innerHTML)return;render()},e=>{S.dbError="เชื่อมต่อฐานข้อมูลตัวชี้วัดไม่ได้ ลองเปิดหน้านี้ใหม่";render()});
  subscribeAccess();
  const h=(location.hash||"").replace("#","");if(["dashboard","entry","admin"].includes(h))S.view=h;setView(S.view)}
render();
if(window.claude&&claude.use)boot();else{S.dbError="เชื่อมต่อระบบไม่ได้ ลองเปิดหน้านี้ใหม่";S.loadedK=true;render()}
